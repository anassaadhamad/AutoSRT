<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <linearGradient id="logoWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Brand Icon Squircle (Left) -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#logoBg)"/>
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Mini waveform inside squircle -->
  <rect x="10" y="20" width="3" height="8" rx="1.5" fill="url(#logoWave)" opacity="0.6"/>
  <rect x="15" y="15" width="3" height="18" rx="1.5" fill="url(#logoWave)" opacity="0.85"/>
  <rect x="20" y="10" width="3" height="28" rx="1.5" fill="url(#logoWave)"/>
  <!-- Mini triangle -->
  <path d="M26 12C26 10.5 27.6 9.6 28.8 10.4L39.8 17.4C40.8 18.1 40.8 19.9 39.8 20.6L28.8 27.6C27.6 28.4 26 27.5 26 26V12Z" fill="url(#logoWave)"/>
  <!-- Mini subtitle bar -->
  <rect x="26" y="32" width="14" height="3" rx="1.5" fill="#38bdf8"/>

  <!-- Brand Typography -->
  <text x="58" y="31" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#f8fafc">Auto</tspan><tspan fill="url(#logoWave)">SRT</tspan>
  </text>

  <!-- Badge / Pill -->
  <rect x="158" y="14" width="46" height="20" rx="6" fill="#34d399" fill-opacity="0.12"/>
  <text x="181" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">AI v1.0</text>
</svg>
